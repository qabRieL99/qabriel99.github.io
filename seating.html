<!DOCTYPE html>
<html lang="tr" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Oturma Düzeni</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,700;0,900;1,400&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ---- TOKENS ---- */
[data-theme="light"] {
  --bg: #f5f0e8;
  --surface: #ffffff;
  --card: #faf7f2;
  --ink: #1a1612;
  --muted: #8a7f72;
  --border: #e0d8cc;
  --shadow: rgba(0,0,0,0.06);
  --ghost-bg: #fff;
}
[data-theme="dark"] {
  --bg: #141210;
  --surface: #1e1b18;
  --card: #252119;
  --ink: #f0ebe3;
  --muted: #6e6860;
  --border: #302b25;
  --shadow: rgba(0,0,0,0.35);
  --ghost-bg: #252119;
}
:root {
  --accent: #c94f2c;
  --accent2: #2c6fc9;
  --lock: #b8862c;
  --radius: 12px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-top: env(safe-area-inset-top, 0px);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }

body {
  background: var(--bg);
  color: var(--ink);
  font-family: 'DM Sans', sans-serif;
  min-height: 100dvh;
  overscroll-behavior-y: none;
  -webkit-tap-highlight-color: transparent;
  transition: background 0.25s, color 0.25s;
}

body::before {
  content: '';
  position: fixed; inset: 0;
  background-image:
    radial-gradient(circle at 15% 20%, rgba(201,79,44,0.07) 0%, transparent 40%),
    radial-gradient(circle at 85% 80%, rgba(44,111,201,0.07) 0%, transparent 40%);
  pointer-events: none; z-index: 0;
}

.app {
  position: relative; z-index: 1;
  max-width: 900px;
  margin: 0 auto;
  padding: 12px 12px calc(24px + var(--safe-bottom));
  padding-top: calc(12px + var(--safe-top));
}

/* ---- TOPBAR ---- */
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
  gap: 8px;
}
.logo {
  font-family: 'Fraunces', serif;
  font-size: clamp(1.4rem, 5vw, 1.9rem);
  font-weight: 900;
  letter-spacing: -1px; line-height: 1;
}
.logo em { font-style: italic; color: var(--accent); }

.theme-toggle {
  background: var(--card);
  border: 1.5px solid var(--border);
  border-radius: 50px;
  width: 52px; height: 30px;
  cursor: pointer;
  position: relative;
  flex-shrink: 0;
  transition: background 0.2s, border-color 0.2s;
  touch-action: manipulation;
}
.theme-toggle::after {
  content: '';
  position: absolute;
  top: 3px; left: 3px;
  width: 22px; height: 22px;
  background: var(--ink);
  border-radius: 50%;
  transition: transform 0.25s cubic-bezier(.34,1.56,.64,1), background 0.2s;
}
[data-theme="dark"] .theme-toggle::after {
  transform: translateX(22px);
  background: #ffd93d;
}
.theme-icon { position: absolute; top: 50%; transform: translateY(-50%); font-size: 0.65rem; pointer-events: none; }
.theme-icon.sun { right: 6px; }
.theme-icon.moon { left: 6px; }

/* ---- PANEL ---- */
.panel {
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  padding: 14px;
  margin-bottom: 10px;
  box-shadow: 0 2px 12px var(--shadow);
  transition: background 0.25s, border-color 0.25s;
}

/* ---- CLASS SWITCHER ---- */
.class-switcher-wrap {
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
  margin-bottom: 10px;
}
.class-switcher-wrap::-webkit-scrollbar { display: none; }
.class-switcher {
  display: flex;
  gap: 8px;
  align-items: center;
  width: max-content;
  padding: 2px 2px 6px;
}

.class-tab {
  padding: 0 16px;
  height: 40px;
  border-radius: 50px;
  border: 1.5px solid var(--border);
  background: var(--card);
  color: var(--muted);
  font-family: 'DM Sans', sans-serif;
  font-size: 0.9rem; font-weight: 500;
  cursor: pointer;
  transition: all 0.18s;
  display: flex; align-items: center; gap: 6px;
  white-space: nowrap;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}
.class-tab.active {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}
.class-tab .del-cls {
  background: none; border: none;
  color: rgba(255,255,255,0.8);
  cursor: pointer; font-size: 1.1rem;
  line-height: 1; padding: 2px 2px 2px 0;
  display: none;
  touch-action: manipulation;
}
.class-tab.active .del-cls { display: inline; }

.btn-new-class {
  padding: 0 16px;
  height: 40px;
  border-radius: 50px;
  border: 1.5px dashed var(--border);
  background: transparent;
  color: var(--muted);
  font-family: 'DM Sans', sans-serif;
  font-size: 0.9rem; font-weight: 500;
  cursor: pointer;
  white-space: nowrap;
  touch-action: manipulation;
  transition: all 0.18s;
}

/* ---- CLASS NAME EDITOR ---- */
.class-name-row {
  display: flex; align-items: center; gap: 8px;
  margin-bottom: 12px;
}
.class-name-input {
  font-family: 'Fraunces', serif;
  font-size: 1.2rem; font-weight: 700;
  background: transparent;
  border: none; border-bottom: 2px solid var(--border);
  color: var(--ink);
  padding: 4px 6px;
  outline: none;
  flex: 1; min-width: 0;
  transition: border-color 0.2s;
  font-size: 16px;
}
.class-name-input:focus { border-bottom-color: var(--accent); }
.class-name-hint { font-size: 0.72rem; color: var(--muted); flex-shrink: 0; }

/* ---- DESK COUNT SETTINGS ---- */
.desk-settings-row {
  display: flex; align-items: center; gap: 8px;
  margin-bottom: 12px;
  padding: 10px;
  background: var(--card);
  border: 1.5px solid var(--border);
  border-radius: 10px;
  flex-wrap: wrap;
  transition: background 0.25s, border-color 0.25s;
}
.desk-settings-row .ds-label {
  font-size: 0.85rem; font-weight: 600; color: var(--ink);
  display: flex; align-items: center; gap: 6px;
  flex-shrink: 0;
}
.desk-settings-row input[type="number"] {
  width: 64px;
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: 8px;
  color: var(--ink);
  font-family: 'DM Sans', sans-serif;
  font-size: 16px;
  padding: 8px 8px;
  outline: none;
  text-align: center;
  -webkit-appearance: none;
  transition: border-color 0.2s;
}
.desk-settings-row input[type="number"]:focus { border-color: var(--accent); }
.ds-cap {
  font-size: 0.78rem; color: var(--muted);
  flex: 1; min-width: 120px;
}
.ds-cap strong { color: var(--ink); }
.btn-apply-desk {
  height: 38px;
  padding: 0 14px;
  border-radius: 8px; border: none;
  background: var(--accent2); color: #fff;
  font-family: 'DM Sans', sans-serif;
  font-size: 0.85rem; font-weight: 600;
  cursor: pointer;
  touch-action: manipulation;
  flex-shrink: 0;
}

/* ---- STUDENT INPUT ---- */
.input-row { display: flex; gap: 8px; margin-bottom: 12px; }
#nameInput {
  flex: 1; min-width: 0;
  background: var(--card);
  border: 1.5px solid var(--border);
  border-radius: 10px;
  color: var(--ink);
  font-family: 'DM Sans', sans-serif;
  font-size: 16px;
  padding: 12px 14px;
  outline: none;
  transition: border-color 0.2s, background 0.25s;
  -webkit-appearance: none;
}
#nameInput:focus { border-color: var(--accent); }
#nameInput::placeholder { color: var(--muted); }

/* ---- BUTTONS ---- */
.btn {
  height: 46px;
  padding: 0 18px;
  border-radius: 10px; border: none;
  font-family: 'DM Sans', sans-serif;
  font-size: 0.95rem; font-weight: 600;
  cursor: pointer; transition: all 0.18s;
  white-space: nowrap;
  touch-action: manipulation;
  display: inline-flex; align-items: center; justify-content: center;
  -webkit-tap-highlight-color: transparent;
}
.btn-add { background: var(--ink); color: var(--bg); flex-shrink: 0; }
.btn-primary {
  background: var(--accent); color: #fff;
  box-shadow: 0 4px 14px rgba(201,79,44,0.3);
  height: 46px; padding: 0 22px;
}
.btn-secondary {
  background: var(--card); color: var(--ink);
  border: 1.5px solid var(--border);
}
.btn-lock {
  background: var(--card); color: var(--ink);
  border: 1.5px solid var(--border);
}
.btn-lock.locked {
  background: var(--lock); color: #fff;
  border-color: var(--lock);
}

/* ---- CHIPS ---- */
.chips-area {
  display: flex; flex-wrap: wrap; gap: 6px;
  min-height: 24px; align-items: flex-start;
}
.chip {
  background: var(--card);
  border: 1.5px solid var(--border);
  border-radius: 20px;
  padding: 5px 10px 5px 12px;
  font-size: 0.85rem; font-weight: 500;
  display: flex; align-items: center; gap: 4px;
  transition: background 0.25s, border-color 0.25s;
}
.chip-del {
  background: none; border: none;
  color: var(--muted); cursor: pointer;
  font-size: 1.1rem; line-height: 1;
  padding: 2px 2px 2px 0;
  touch-action: manipulation;
  transition: color 0.15s;
}
.chip-del:hover { color: var(--accent); }
.chip-count { font-size: 0.8rem; color: var(--muted); }

/* ---- ACTION BAR ---- */
.action-bar {
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  padding: 10px 12px;
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  transition: background 0.25s, border-color 0.25s;
}
.capacity-info { font-size: 0.82rem; color: var(--muted); flex: 1; min-width: 0; }
.capacity-info strong { color: var(--ink); }
.action-btns { display: flex; gap: 8px; flex-shrink: 0; }
@media (max-width: 380px) {
  .action-bar { flex-direction: column; align-items: stretch; }
  .action-btns { width: 100%; }
  .btn-primary { flex: 1; }
  .capacity-info { text-align: center; }
}

.drag-hint {
  text-align: center; font-size: 0.8rem; color: var(--muted);
  margin-bottom: 12px; padding: 0 8px;
  transition: color 0.2s;
}
.drag-hint.locked-hint { color: var(--lock); font-weight: 600; }

/* ---- CLASSROOM ---- */
.board {
  background: var(--ink); color: var(--bg);
  text-align: center; padding: 10px;
  border-radius: 10px;
  font-family: 'Fraunces', serif;
  font-size: 0.95rem; letter-spacing: 1px;
  margin-bottom: 12px;
  transition: background 0.25s, color 0.25s;
}

.classroom { display: flex; flex-direction: column; gap: 8px; }

.row-group {
  display: grid;
  grid-template-columns: 1fr 28px 1fr;
  gap: 6px;
  align-items: center;
}

.aisle {
  display: flex; align-items: center; justify-content: center;
  font-size: 0.55rem; color: var(--muted);
  writing-mode: vertical-rl;
  user-select: none; letter-spacing: 0.05em;
  opacity: 0.6;
}

.desk-placeholder { min-height: 68px; }

/* ---- DESK ---- */
.desk {
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  display: grid;
  grid-template-columns: 1fr 1fr;
  overflow: hidden;
  position: relative;
  min-height: 68px;
  transition: background 0.25s, border-color 0.25s;
}
.desk-label {
  position: absolute; top: 3px; left: 5px;
  font-size: 0.58rem; color: var(--muted);
  z-index: 1; pointer-events: none; opacity: 0.7;
}

/* ---- SEAT ---- */
.seat {
  padding: 8px 6px;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 3px; position: relative;
  min-height: 66px;
  -webkit-user-select: none; user-select: none;
  transition: background 0.15s, transform 0.16s cubic-bezier(.34,1.56,.64,1), box-shadow 0.16s;
  -webkit-tap-highlight-color: transparent;
}
.seat:first-of-type { border-right: 1px solid var(--border); }

.seat.filled { cursor: grab; }
.seat.filled:active { cursor: grabbing; }
.seat.filled.locked { cursor: not-allowed; }

.seat.empty {
  background: repeating-linear-gradient(
    45deg, transparent, transparent 5px,
    rgba(128,128,128,0.05) 5px, rgba(128,128,128,0.05) 6px
  );
}

.seat.dragging-source {
  opacity: 0.3;
  transform: scale(0.92) rotate(-2deg);
}

.seat.drag-over {
  background: rgba(44,111,201,0.16) !important;
  outline: 2px solid var(--accent2);
  outline-offset: -2px; z-index: 2;
  transform: scale(1.06);
  box-shadow: 0 8px 22px rgba(44,111,201,0.35);
}

.lock-badge {
  position: absolute; top: 3px; right: 5px;
  font-size: 0.6rem; opacity: 0.55; pointer-events: none;
}

@keyframes seatPop {
  0%   { transform: scale(1); }
  30%  { transform: scale(1.16) rotate(-3deg); background: rgba(201,79,44,0.18); }
  60%  { transform: scale(0.96) rotate(2deg); }
  100% { transform: scale(1); }
}
.seat.popped { animation: seatPop 0.42s ease; }

.seat-num { font-size: 0.6rem; color: var(--muted); font-weight: 500; opacity: 0.7; }
.seat-name {
  font-size: clamp(0.7rem, 2.8vw, 0.88rem);
  font-weight: 600;
  text-align: center; line-height: 1.2;
  word-break: break-word;
  hyphens: auto;
}

/* ---- DRAG GHOST ---- */
#drag-ghost {
  position: fixed;
  pointer-events: none; z-index: 9999;
  background: var(--ghost-bg);
  border: 2px solid var(--accent);
  border-radius: 10px;
  padding: 9px 16px;
  font-family: 'DM Sans', sans-serif;
  font-size: 0.92rem; font-weight: 700;
  color: var(--ink);
  box-shadow: 0 10px 32px rgba(0,0,0,0.28);
  white-space: nowrap;
  opacity: 0.96;
  transform: translate(-50%, -140%) scale(1);
  display: none;
  transition: background 0.25s, color 0.25s;
}
@keyframes ghostFloat {
  0%, 100% { transform: translate(-50%, -140%) scale(1) rotate(-2deg); }
  50%      { transform: translate(-50%, -140%) scale(1.09) rotate(2deg); }
}
#drag-ghost.active { animation: ghostFloat 0.55s ease-in-out infinite; }

/* ---- TOAST ---- */
.toast {
  position: fixed; bottom: calc(20px + var(--safe-bottom)); left: 50%;
  transform: translateX(-50%) translateY(80px);
  background: var(--ink); color: var(--bg);
  font-size: 0.88rem; font-weight: 500;
  padding: 12px 24px; border-radius: 50px;
  transition: transform 0.3s cubic-bezier(.34,1.56,.64,1);
  z-index: 1000; pointer-events: none; white-space: nowrap;
  box-shadow: 0 4px 20px rgba(0,0,0,0.2);
}
.toast.show { transform: translateX(-50%) translateY(0); }

/* ---- NOTE PANEL ---- */
.note-panel {
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  padding: 14px;
  margin-top: 10px;
  box-shadow: 0 2px 12px var(--shadow);
  transition: background 0.25s, border-color 0.25s;
}
.note-panel-label {
  font-family: 'Fraunces', serif;
  font-size: 0.95rem; font-weight: 700;
  margin-bottom: 8px;
  display: flex; align-items: center; gap: 6px;
}
#noteArea {
  width: 100%;
  min-height: 70px;
  resize: vertical;
  background: var(--card);
  border: 1.5px solid var(--border);
  border-radius: 10px;
  color: var(--ink);
  font-family: 'DM Sans', sans-serif;
  font-size: 16px;
  line-height: 1.4;
  padding: 10px 12px;
  outline: none;
  transition: border-color 0.2s, background 0.25s;
}
#noteArea:focus { border-color: var(--accent); }
#noteArea::placeholder { color: var(--muted); }

/* ---- PRINT-ONLY ELEMENTS (hidden on screen) ---- */
.print-only { display: none; }

/* ---- PRINT ---- */
@media print {
  @page { margin: 14mm 12mm; }
  body { background: white; color: #1a1612; }
  body::before, .topbar, .panel, .class-switcher-wrap,
  .action-bar, .drag-hint, .toast, .note-panel { display: none !important; }

  .print-only { display: block; }
  #printHeader {
    text-align: center;
    margin-bottom: 14px;
    padding-bottom: 10px;
    border-bottom: 3px solid #c94f2c;
  }
  #printHeader .ph-title {
    font-family: 'Fraunces', serif;
    font-weight: 900;
    font-size: 1.7rem;
    letter-spacing: -0.5px;
    color: #1a1612;
  }
  #printHeader .ph-meta {
    font-family: 'DM Sans', sans-serif;
    font-size: 0.8rem;
    color: #6b6259;
    margin-top: 4px;
  }

  .board {
    display: block !important;
    background: #c94f2c !important; color: #fff !important;
    -webkit-print-color-adjust: exact; print-color-adjust: exact;
    box-shadow: 0 2px 6px rgba(0,0,0,0.15);
  }

  .seat.empty { visibility: hidden; }
  .desk {
    border-color: #d8cfc2 !important;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    -webkit-print-color-adjust: exact; print-color-adjust: exact;
  }
  .desk-label { color: #2c6fc9 !important; opacity: 1; font-weight: 700; }
  .seat-name { color: #1a1612 !important; }
  .seat-num {
    color: #fff !important;
    background: #2c6fc9;
    border-radius: 50%;
    width: 16px; height: 16px;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 0.55rem;
    -webkit-print-color-adjust: exact; print-color-adjust: exact;
  }
  .seat:first-of-type { border-right: 1px solid #e5ddd0; }
  .aisle { color: #b0a89b !important; opacity: 1; }

  #printNote {
    margin-top: 18px;
    padding: 12px 14px;
    border: 1.5px dashed #c9a24f;
    border-radius: 10px;
    background: #fdf8ee;
    -webkit-print-color-adjust: exact; print-color-adjust: exact;
  }
  #printNote .pn-label {
    font-family: 'Fraunces', serif;
    font-weight: 700; font-size: 0.85rem;
    color: #8a6a1c; margin-bottom: 6px;
  }
  #printNote .pn-text {
    font-family: 'DM Sans', sans-serif;
    font-size: 0.85rem; color: #1a1612;
    white-space: pre-wrap; line-height: 1.5;
  }
}

/* ---- LANDSCAPE PHONES ---- */
@media (max-height: 500px) and (orientation: landscape) {
  .app { padding-top: 8px; }
  .topbar { margin-bottom: 8px; }
  .panel { padding: 10px 12px; margin-bottom: 8px; }
  .class-name-row { margin-bottom: 8px; }
}
</style>
</head>
<body>
<div id="drag-ghost"></div>
<div class="app">

  <!-- PRINT-ONLY HEADER -->
  <div id="printHeader" class="print-only">
    <div class="ph-title" id="printTitle"></div>
    <div class="ph-meta" id="printMeta"></div>
  </div>

  <!-- TOPBAR -->
  <div class="topbar">
    <div class="logo">Oturma <em>Düzeni</em></div>
    <button class="theme-toggle" onclick="toggleTheme()" title="Koyu/Açık mod">
      <span class="theme-icon sun">☀️</span>
      <span class="theme-icon moon">🌙</span>
    </button>
  </div>

  <!-- CLASS SWITCHER -->
  <div class="class-switcher-wrap">
    <div class="class-switcher" id="classSwitcher"></div>
  </div>

  <!-- INPUT PANEL -->
  <div class="panel" id="inputPanel">
    <div class="class-name-row">
      <input class="class-name-input" id="classNameInput"
        placeholder="Sınıf adı..."
        maxlength="30"
        onchange="saveClassName()"
        onblur="saveClassName()">
      <span class="class-name-hint">&larr; düzenle</span>
    </div>

    <div class="desk-settings-row">
      <span class="ds-label">🪑 Masa Sayısı</span>
      <input type="number" id="deskCountInput" min="1" max="30" step="1">
      <button class="btn-apply-desk" onclick="applyDeskCount()">Uygula</button>
      <span class="ds-cap" id="deskCapInfo"></span>
    </div>

    <div class="input-row">
      <input id="nameInput" type="text"
        placeholder="Öğrenci adı girin..."
        maxlength="40"
        autocomplete="off"
        autocorrect="off"
        autocapitalize="words"
        onkeydown="if(event.key==='Enter'){addName();event.preventDefault()}">
      <button class="btn btn-add" onclick="addName()">+ Ekle</button>
    </div>
    <div class="chips-area" id="chips"></div>
  </div>

  <!-- ACTION BAR -->
  <div class="action-bar" id="actionBar" style="display:none">
    <span class="capacity-info" id="capInfo"></span>
    <div class="action-btns">
      <button class="btn btn-lock" id="lockBtn" onclick="toggleLock()" title="Düzeni kilitle">🔓</button>
      <button class="btn btn-secondary" onclick="doShuffle()" title="Karıştır">🔀</button>
      <button class="btn btn-secondary" onclick="preparePrint();window.print()" title="Yazdır">🖨️</button>
      <button class="btn btn-primary" onclick="generate()">Oturt!</button>
    </div>
  </div>

  <div class="drag-hint" id="dragHint" style="display:none">
    ✋ Öğrencileri basılı tutup sürükleyerek yer değiştirin
  </div>

  <div id="seating"></div>

  <!-- PRINT-ONLY NOTE (populated from noteArea before printing) -->
  <div id="printNote" class="print-only">
    <div class="pn-label">📝 Not</div>
    <div class="pn-text" id="printNoteText"></div>
  </div>

  <!-- NOTE PANEL -->
  <div class="note-panel" id="notePanel" style="display:none">
    <div class="note-panel-label">📝 Not</div>
    <textarea id="noteArea" placeholder="Örn: Sınav süresi, oturma kuralları, uyarılar..." maxlength="500"
      oninput="saveNote()"></textarea>
  </div>
</div>
<div class="toast" id="toastEl"></div>

<script>
// ---- STATE ----
let data = loadData();
let dragSrcIdx = null, touchDragIdx = null, lastOver = null;

// ---- STORAGE ----
function loadData() {
  try {
    const raw = localStorage.getItem('oturma_v2');
    if (raw) {
      const parsed = JSON.parse(raw);
      migrate(parsed);
      return parsed;
    }
  } catch(e) {}
  const cls = makeClass('1. Sınıf');
  return { theme: 'light', activeId: cls.id, classes: [cls] };
}

function migrate(d) {
  if (!Array.isArray(d.classes)) d.classes = [];
  d.classes.forEach(c => {
    if (!c.deskCount) {
      c.deskCount = Math.max(1, Math.round((Array.isArray(c.order) ? c.order.length : 20) / 2));
    }
    const need = c.deskCount * 2;
    if (!Array.isArray(c.order) || c.order.length !== need) {
      const old = Array.isArray(c.order) ? c.order : [];
      const resized = Array(need).fill(null);
      for (let i = 0; i < Math.min(old.length, need); i++) resized[i] = old[i];
      c.order = resized;
    }
    if (typeof c.locked !== 'boolean') c.locked = false;
    if (!Array.isArray(c.names)) c.names = [];
    if (typeof c.note !== 'string') c.note = '';
  });
}

function saveData() {
  try { localStorage.setItem('oturma_v2', JSON.stringify(data)); } catch(e) {}
}
function makeClass(name) {
  const deskCount = 10;
  return {
    id: Date.now() + '_' + Math.random().toString(36).slice(2),
    name: name || 'Yeni Sınıf',
    names: [],
    deskCount: deskCount,
    order: Array(deskCount * 2).fill(null),
    locked: false,
    note: ''
  };
}
function getActive() {
  return data.classes.find(c => c.id === data.activeId) || data.classes[0];
}
function totalSeats(cls) { return (cls.deskCount || 10) * 2; }

// ---- THEME ----
function applyTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  data.theme = t; saveData();
}
function toggleTheme() { applyTheme(data.theme === 'light' ? 'dark' : 'light'); }
applyTheme(data.theme);

// ---- TOAST ----
function toast(msg) {
  const t = document.getElementById('toastEl');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.remove('show'), 2200);
}

// ---- CLASS SWITCHER ----
function renderSwitcher() {
  const sw = document.getElementById('classSwitcher');
  sw.innerHTML = '';
  data.classes.forEach(cls => {
    const btn = document.createElement('button');
    btn.className = 'class-tab' + (cls.id === data.activeId ? ' active' : '');
    btn.innerHTML = '<span>' + (cls.locked ? '🔒 ' : '') + cls.name + '</span>';
    if (cls.id === data.activeId) {
      const del = document.createElement('button');
      del.className = 'del-cls';
      del.textContent = '×';
      del.title = 'Sınıfı sil';
      del.onclick = e => { e.stopPropagation(); deleteClass(cls.id); };
      btn.appendChild(del);
    }
    btn.addEventListener('click', () => switchClass(cls.id));
    sw.appendChild(btn);
  });
  const addBtn = document.createElement('button');
  addBtn.className = 'btn-new-class';
  addBtn.textContent = '+ Yeni Sınıf';
  addBtn.onclick = newClass;
  sw.appendChild(addBtn);
}

function switchClass(id) {
  data.activeId = id; saveData(); renderAll();
}
function newClass() {
  const cls = makeClass('Sınıf ' + (data.classes.length + 1));
  data.classes.push(cls);
  data.activeId = cls.id;
  saveData(); renderAll();
  setTimeout(() => {
    const inp = document.getElementById('classNameInput');
    inp.focus(); inp.select();
  }, 80);
}
function deleteClass(id) {
  if (data.classes.length === 1) { toast('En az bir sınıf olmalı!'); return; }
  if (!confirm('Bu sınıfı silmek istediğinizden emin misiniz?')) return;
  data.classes = data.classes.filter(c => c.id !== id);
  data.activeId = data.classes[0].id;
  saveData(); renderAll(); toast('Sınıf silindi.');
}
function saveClassName() {
  const cls = getActive();
  const val = document.getElementById('classNameInput').value.trim();
  if (val) { cls.name = val; saveData(); renderSwitcher(); }
}

// ---- DESK COUNT SETTINGS ----
function applyDeskCount() {
  const cls = getActive();
  if (cls.locked) { toast('🔒 Önce kilidi açın'); document.getElementById('deskCountInput').value = cls.deskCount; return; }
  let v = parseInt(document.getElementById('deskCountInput').value, 10);
  if (!v || v < 1) v = 1;
  if (v > 30) v = 30;
  cls.deskCount = v;
  cls.order = Array(v * 2).fill(null);
  saveData(); renderAll();
  toast('🪑 ' + v + ' masa = ' + (v * 2) + ' kişilik düzen');
}
function updateDeskSettingsUI() {
  const cls = getActive();
  document.getElementById('deskCountInput').value = cls.deskCount;
  document.getElementById('deskCountInput').disabled = cls.locked;
  document.getElementById('deskCapInfo').innerHTML =
    '<strong>' + totalSeats(cls) + '</strong> kişilik kapasite';
}

// ---- STUDENTS ----
function addName() {
  const cls = getActive();
  const inp = document.getElementById('nameInput');
  const v = inp.value.trim();
  if (!v) return;
  if (cls.names.map(n => n.toLowerCase()).includes(v.toLowerCase())) {
    toast('Bu isim zaten var!'); inp.select(); return;
  }
  if (cls.names.length >= totalSeats(cls)) { toast('Maksimum ' + totalSeats(cls) + ' öğrenci!'); return; }
  cls.names.push(v);
  cls.order = Array(totalSeats(cls)).fill(null);
  inp.value = '';
  saveData(); renderChips(); showBar(); inp.focus();
}

function removeName(i) {
  const cls = getActive();
  cls.names.splice(i, 1);
  cls.order = Array(totalSeats(cls)).fill(null);
  saveData(); renderChips();
  if (!cls.names.length) {
    document.getElementById('actionBar').style.display = 'none';
    document.getElementById('dragHint').style.display = 'none';
    document.getElementById('seating').innerHTML = '';
  } else showBar();
}

function renderChips() {
  const cls = getActive();
  const area = document.getElementById('chips');
  area.innerHTML = '';
  if (!cls.names.length) {
    area.innerHTML = '<span class="chip-count">Henüz öğrenci eklenmedi.</span>';
    return;
  }
  cls.names.forEach((n, i) => {
    const c = document.createElement('div');
    c.className = 'chip';
    c.innerHTML = n + '<button class="chip-del" onclick="removeName(' + i + ')">×</button>';
    area.appendChild(c);
  });
  const cnt = document.createElement('span');
  cnt.className = 'chip-count';
  cnt.textContent = cls.names.length + ' / ' + totalSeats(cls);
  area.appendChild(cnt);
}

function showBar() {
  document.getElementById('actionBar').style.display = 'flex';
  updateCap();
  updateLockBtn();
}
function updateCap() {
  const cls = getActive();
  const filled = cls.order.filter(Boolean).length;
  document.getElementById('capInfo').innerHTML =
    '<strong>' + filled + '</strong> oturma · <strong>' + (totalSeats(cls) - filled) + '</strong> boş';
}

// ---- NOTE ----
function saveNote() {
  const cls = getActive();
  cls.note = document.getElementById('noteArea').value;
  saveData();
}
function renderNote() {
  const cls = getActive();
  document.getElementById('notePanel').style.display = 'block';
  document.getElementById('noteArea').value = cls.note || '';
}

// ---- PRINT PREP ----
function preparePrint() {
  const cls = getActive();
  document.getElementById('printTitle').textContent = cls.name;
  const now = new Date();
  const dateStr = now.toLocaleDateString('tr-TR', { day: '2-digit', month: 'long', year: 'numeric' });
  const filled = cls.order.filter(Boolean).length;
  document.getElementById('printMeta').textContent =
    dateStr + '  ·  ' + filled + ' öğrenci  ·  ' + totalSeats(cls) + ' kişilik düzen';

  const noteBlock = document.getElementById('printNote');
  const note = (cls.note || '').trim();
  if (note) {
    document.getElementById('printNoteText').textContent = note;
    noteBlock.style.display = '';
  } else {
    noteBlock.style.display = 'none';
  }
}
window.addEventListener('beforeprint', preparePrint);

// ---- LOCK ----
function toggleLock() {
  const cls = getActive();
  cls.locked = !cls.locked;
  saveData();
  updateLockBtn();
  renderSwitcher();
  renderClassroom();
  updateDeskSettingsUI();
  toast(cls.locked ? '🔒 Oturma düzeni kilitlendi' : '🔓 Kilit açıldı');
}
function updateLockBtn() {
  const cls = getActive();
  const btn = document.getElementById('lockBtn');
  if (!btn) return;
  btn.textContent = cls.locked ? '🔒' : '🔓';
  btn.classList.toggle('locked', cls.locked);
  btn.title = cls.locked ? 'Kilidi aç' : 'Düzeni kilitle';
  const hint = document.getElementById('dragHint');
  if (cls.order.some(Boolean)) {
    hint.style.display = 'block';
    hint.textContent = cls.locked
      ? '🔒 Düzen kilitli — değişiklik yapmak için önce kilidi açın'
      : '✋ Öğrencileri basılı tutup sürükleyerek yer değiştirin';
    hint.classList.toggle('locked-hint', cls.locked);
  }
}

// ---- GENERATE ----
function generate() {
  const cls = getActive();
  if (cls.locked) { toast('🔒 Düzen kilitli, önce kilidi açın'); return; }
  if (!cls.names.length) return;
  const cap = totalSeats(cls);
  const slots = Array(cap).fill(null);
  const sh = [...cls.names];
  for (let i = sh.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [sh[i], sh[j]] = [sh[j], sh[i]];
  }
  const seatCount = Math.min(sh.length, cap);
  for (let i = 0; i < seatCount; i++) slots[i] = sh[i];
  cls.order = slots;
  saveData(); renderClassroom(); updateCap();
  document.getElementById('dragHint').style.display = 'block';
  updateLockBtn();
  if (sh.length > cap) {
    toast('🎲 Düzen oluşturuldu! (' + (sh.length - cap) + ' öğrenci için masa yetersiz)');
  } else {
    toast('🎲 Düzen oluşturuldu!');
  }
}
function doShuffle() {
  const cls = getActive();
  if (cls.locked) { toast('🔒 Düzen kilitli, önce kilidi açın'); return; }
  generate(); toast('🔀 Yeni düzen!');
}

// ---- RENDER CLASSROOM ----
function renderClassroom() {
  const cls  = getActive();
  const deskCount = cls.deskCount || 10;
  const rows = Math.ceil(deskCount / 2);
  const area = document.getElementById('seating');
  area.innerHTML = '';

  const board = document.createElement('div');
  board.className = 'board';
  board.textContent = '⬛  TAHTA  ⬛';
  area.appendChild(board);

  const classroom = document.createElement('div');
  classroom.className = 'classroom';
  for (let r = 0; r < rows; r++) {
    const rowEl = document.createElement('div');
    rowEl.className = 'row-group';

    const leftDeskIdx = r * 2;
    const rightDeskIdx = r * 2 + 1;

    rowEl.appendChild(
      leftDeskIdx < deskCount ? makeDeskEl(cls, leftDeskIdx, 'L') : placeholderEl()
    );

    const aisle = document.createElement('div');
    aisle.className = 'aisle';
    aisle.textContent = 'KRD';
    rowEl.appendChild(aisle);

    rowEl.appendChild(
      rightDeskIdx < deskCount ? makeDeskEl(cls, rightDeskIdx, 'R') : placeholderEl()
    );

    classroom.appendChild(rowEl);
  }
  area.appendChild(classroom);
}

function placeholderEl() {
  const d = document.createElement('div');
  d.className = 'desk-placeholder';
  return d;
}

function makeDeskEl(cls, deskIdx, side) {
  const desk = document.createElement('div');
  desk.className = 'desk';
  const lbl = document.createElement('span');
  lbl.className = 'desk-label';
  lbl.textContent = (Math.floor(deskIdx / 2) + 1) + side;
  desk.appendChild(lbl);
  desk.appendChild(makeSeatEl(cls, deskIdx * 2));
  desk.appendChild(makeSeatEl(cls, deskIdx * 2 + 1));
  return desk;
}

function makeSeatEl(cls, idx) {
  const name = cls.order[idx] || null;
  const seat = document.createElement('div');
  seat.className = 'seat ' + (name ? 'filled' : 'empty') + (cls.locked ? ' locked' : '');
  seat.dataset.idx = idx;

  if (name) {
    seat.innerHTML = '<span class="seat-num">' + (idx + 1) + '</span><div class="seat-name">' + name + '</div>';
    if (cls.locked) {
      const badge = document.createElement('span');
      badge.className = 'lock-badge';
      badge.textContent = '🔒';
      seat.appendChild(badge);
    } else {
      seat.draggable = true;
      seat.addEventListener('dragstart', e => {
        dragSrcIdx = idx;
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', String(idx));
        setTimeout(() => seat.classList.add('dragging-source'), 0);
      });
      seat.addEventListener('dragend', () => {
        seat.classList.remove('dragging-source');
        document.querySelectorAll('.seat').forEach(s => s.classList.remove('drag-over'));
        dragSrcIdx = null;
      });
      seat.addEventListener('touchstart', onTouchStart, { passive: false });
    }
  }

  seat.addEventListener('dragover', e => {
    if (cls.locked) return;
    if (dragSrcIdx !== null && dragSrcIdx !== idx) { e.preventDefault(); seat.classList.add('drag-over'); }
  });
  seat.addEventListener('dragleave', () => seat.classList.remove('drag-over'));
  seat.addEventListener('drop', e => {
    if (cls.locked) return;
    e.preventDefault(); seat.classList.remove('drag-over');
    if (dragSrcIdx !== null && dragSrcIdx !== idx) doSwap(dragSrcIdx, idx);
  });

  return seat;
}

// ---- TOUCH DRAG ----
const ghost = document.getElementById('drag-ghost');

function onTouchStart(e) {
  if (getActive().locked) return;
  e.preventDefault();
  const seat = e.currentTarget;
  touchDragIdx = parseInt(seat.dataset.idx);
  ghost.textContent = '✋ ' + getActive().order[touchDragIdx];
  ghost.style.display = 'block';
  ghost.classList.add('active');
  movGhost(e.touches[0]);
  seat.classList.add('dragging-source');
  if (navigator.vibrate) { try { navigator.vibrate(12); } catch(err) {} }
  document.addEventListener('touchmove', onTouchMove, { passive: false });
  document.addEventListener('touchend', onTouchEnd, { once: true });
}

function onTouchMove(e) {
  e.preventDefault();
  const touch = e.touches[0];
  movGhost(touch);
  ghost.style.display = 'none';
  const el = document.elementFromPoint(touch.clientX, touch.clientY);
  ghost.style.display = 'block';
  const target = el ? el.closest('.seat') : null;
  if (lastOver && lastOver !== target) lastOver.classList.remove('drag-over');
  const srcSeat = document.querySelector('.seat[data-idx="' + touchDragIdx + '"]');
  if (target && target !== srcSeat) { target.classList.add('drag-over'); lastOver = target; }
  else lastOver = null;
}

function onTouchEnd() {
  document.removeEventListener('touchmove', onTouchMove);
  ghost.style.display = 'none';
  ghost.classList.remove('active');
  document.querySelectorAll('.seat').forEach(s => s.classList.remove('dragging-source', 'drag-over'));
  if (lastOver) {
    const targetIdx = parseInt(lastOver.dataset.idx);
    if (touchDragIdx !== null && touchDragIdx !== targetIdx) doSwap(touchDragIdx, targetIdx);
    lastOver = null;
  }
  touchDragIdx = null;
}

function movGhost(touch) {
  ghost.style.left = touch.clientX + 'px';
  ghost.style.top  = touch.clientY + 'px';
}

// ---- SWAP ----
function doSwap(a, b) {
  const cls = getActive();
  if (cls.locked) { toast('🔒 Düzen kilitli, önce kilidi açın'); return; }
  [cls.order[a], cls.order[b]] = [cls.order[b], cls.order[a]];
  saveData(); renderClassroom(); updateCap();
  setTimeout(() => {
    document.querySelectorAll('.seat[data-idx="' + a + '"], .seat[data-idx="' + b + '"]').forEach(s => {
      s.classList.add('popped');
      setTimeout(() => s.classList.remove('popped'), 420);
    });
  }, 10);
  toast('✅ Yer değiştirildi!');
}

// ---- RENDER ALL ----
function renderAll() {
  const cls = getActive();
  renderSwitcher();
  document.getElementById('classNameInput').value = cls.name;
  updateDeskSettingsUI();
  renderChips();
  renderNote();
  const hasSeated = cls.order.some(Boolean);
  if (cls.names.length) {
    showBar();
    if (hasSeated) {
      renderClassroom();
      updateLockBtn();
    } else {
      document.getElementById('seating').innerHTML = '';
      document.getElementById('dragHint').style.display = 'none';
    }
  } else {
    document.getElementById('actionBar').style.display = 'none';
    document.getElementById('dragHint').style.display = 'none';
    document.getElementById('seating').innerHTML = '';
  }
}

// ---- INIT ----
renderAll();
</script>

</body>
</html>
